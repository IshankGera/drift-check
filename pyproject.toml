[project]
name = "py-drift-check"
version = "0.2.6"
description = "Upgrade-impact analyzer: check your Python code against a future dependency version before you upgrade."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ishank Gera", email = "geraishank09@gmail.com" }]
keywords = ["dependencies", "upgrade", "api-drift", "breaking-changes", "static-analysis", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "packaging>=24.0",
    "uv>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/IshankGera/drift-check"
Repository = "https://github.com/IshankGera/drift-check"
Issues = "https://github.com/IshankGera/drift-check/issues"

[project.scripts]
drift-check = "drift_check.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drift_check"]

[tool.hatch.build.targets.sdist]
include = ["drift_check", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
