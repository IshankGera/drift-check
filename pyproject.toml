[project]
name = "py-drift-check" 
version = "0.1.0"
description = "Detect API drift between codebase and installed dependencies."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0"
]

[project.scripts]
drift-check = "drift_check.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drift_check"]